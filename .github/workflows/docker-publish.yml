name: Publicar no Docker Hub
on:
  workflow_dispatch:
  push:
    tags: ['v3.1.0']
permissions:
  contents: read
jobs:
  publicar:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/tags/v3.1.0'
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: agathacastro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Verificar configuração do Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "Cadastre o secret DOCKERHUB_TOKEN antes de publicar."
            exit 1
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Entrar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Construir e publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            agathacastro/bootcamp2-climaflow:3.1.0
